name: Verify research evidence
on: [push, pull_request]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_results.py
      - run: python -m unittest discover -s experiments/optimizer_grid -p 'test_*.py'
      - run: python experiments/optimizer_grid/run.py --dry-run
